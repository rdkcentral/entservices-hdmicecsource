name: vDevice Image Tests and Coverage

permissions:
  contents: read

on:
  push:
    branches:
      - 'test/RDKEMW-28707'
  workflow_dispatch:
    inputs:
      build_number:
        description: "VDEVICE-Middleware-Github build number from the RDK-E portal"
        required: true
        type: string
      source_ref:
        description: "Branch/tag/SHA containing configuration and test cases"
        required: false
        default: "develop"
  workflow_call:
    inputs:
      build_number:
        description: "VDEVICE-Middleware-Github build number from the RDK-E portal"
        required: true
        type: string
      source_ref:
        description: "Branch/tag/SHA containing configuration and test cases"
        required: false
        type: string
        default: "develop"
    secrets:
      RDK_PORTAL_USERNAME:
        required: true
      RDK_PORTAL_TOKEN:
        required: true

jobs:
  test-image:
    name: Test portal image and collect coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest
    defaults:
      run:
        shell: bash
    env:
      BUILD_NUMBER: ${{ inputs.build_number || vars.RDK_PORTAL_BUILD_NUMBER }}
      QEMU_WORKDIR: /tmp/qemu-artifacts
      SSH_HOST_PORT: '5522'
      WPEFRAMEWORK_HOST_PORT: '59998'
      VCOMPONENT_HOST_PORT: '58080'

    steps:
      - name: Validate RDK-E portal inputs
        env:
          RDK_PORTAL_USERNAME: ${{ secrets.RDK_PORTAL_USERNAME }}
          RDK_PORTAL_TOKEN: ${{ secrets.RDK_PORTAL_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "ERROR: build_number must contain only digits." >&2
            exit 1
          }
          [[ -n "$RDK_PORTAL_USERNAME" && -n "$RDK_PORTAL_TOKEN" ]] || {
            echo "ERROR: configure RDK_PORTAL_USERNAME and RDK_PORTAL_TOKEN secrets." >&2
            exit 1
          }

      - name: Clone build framework configuration and tests
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}
          path: build-framework

      - name: Load build framework configuration
        run: |
          set -euo pipefail
          # apt's "yq" package (if present) is an unrelated jq wrapper; install
          # the real mikefarah/yq binary directly so `-r` semantics match.
          if ! command -v yq >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates
            YQ_VERSION="v4.44.3"
            curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/dowinstadnload/${YQ_VERSION}/yq_linux_amd64"
            chmod +x /usr/local/bin/yq
          fi

          config_file="$GITHUB_WORKSPACE/build-framework/build-config.yml"
          [[ -f "$config_file" ]] || { echo "ERROR: missing build config: $config_file" >&2; exit 1; }
          [[ "$(yq -r '.version' "$config_file")" == "1" ]] || {
            echo "ERROR: unsupported build config version" >&2
            exit 1
          }

          mkdir -p "$QEMU_WORKDIR"
          {
            echo "COMPONENT_SLUG=$(yq -r '.component.slug' "$config_file")"
            echo "COMPONENT_DIR=$(yq -r '.component.source_directory' "$config_file")"
            echo "QEMU_KERNEL_ARTIFACT_PATH=$(yq -r '.component.qemu_kernel_artifact_path // ""' "$config_file")"
            echo "QEMU_ROOTFS_ARTIFACT_PATH=$(yq -r '.component.qemu_rootfs_artifact_path // ""' "$config_file")"
            echo "PLUGIN_CALLSIGN=$(yq -r '.component.plugin_callsign' "$config_file")"
            echo "TESTS_DIRECTORY=$(yq -r '.execution.tests_directory' "$config_file")"
            echo "TEST_ENTRYPOINT=$(yq -r '.execution.test_entrypoint' "$config_file")"
            echo "TEST_ENVIRONMENT=$(yq -r '.execution.test_environment // {} | to_entries | .[] | "\(.key)=\(.value)"' "$config_file" | tr '\n' ' ')"
            echo "PLUGIN_GUEST_DIR=$(yq -r '.copy.plugin.guest_directory' "$config_file")"
            echo "PLUGIN_GUEST_GLOB=$(yq -r '.copy.plugin.guest_glob' "$config_file")"
            echo "MIN_COVERAGE=$(yq -r '.coverage.minimum_coverage_threshold' "$config_file")"
            echo "COVERAGE_SOURCE_DIRECTORY=$(yq -r '.coverage.source_directory' "$config_file")"
          } >> "$GITHUB_ENV"

      - name: Validate configured test entrypoint
        run: |
          set -euo pipefail
          test_entrypoint="$GITHUB_WORKSPACE/build-framework/$TESTS_DIRECTORY/$TEST_ENTRYPOINT"
          [[ -f "$test_entrypoint" ]] || {
            echo "ERROR: test entrypoint not found in framework checkout: $test_entrypoint" >&2
            exit 1
          }

      - name: Install QEMU and SSH tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            openssh-client \
            curl \
            jq \
            ca-certificates \
            netcat-openbsd \
            libarchive-tools \
            git-lfs

          command -v qemu-system-x86_64 >/dev/null

      - name: Install Coverage Tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lcov \
            gcovr

      - name: Download vDevice QEMU image from RDK-E portal
        env:
          RDK_PORTAL_USERNAME: ${{ secrets.RDK_PORTAL_USERNAME }}
          RDK_PORTAL_TOKEN: ${{ secrets.RDK_PORTAL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$QEMU_WORKDIR"
          for path_var in QEMU_KERNEL_ARTIFACT_PATH QEMU_ROOTFS_ARTIFACT_PATH; do
            [[ -n "${!path_var}" && "${!path_var}" != *REPLACE_ME* ]] || {
              echo "ERROR: set $path_var in build-config.yml to the portal file_path." >&2
              exit 1
            }
          done

          download_artifact() {
            local file_path="$1" output="$2"
            echo "Downloading $file_path (build $BUILD_NUMBER)"
            curl -sS -fL --retry 3 --get \
              -u "$RDK_PORTAL_USERNAME:$RDK_PORTAL_TOKEN" \
              --data-urlencode "job_name=VDEVICE-Middleware-Github" \
              --data-urlencode "build_number=$BUILD_NUMBER" \
              --data-urlencode "file_path=build-images/vdevice-test-image-vdevice_x86-64-mw-20261113170848.rootfs.ext4" \
              --data-urlencode "download=true" \
              "https://rdkportal-e.stb.r53.xcal.tv/api/artifacts" \
              -o "$output"
            [[ -s "$output" ]] || { echo "ERROR: downloaded $file_path is empty." >&2; exit 1; }
          }

          download_artifact "$QEMU_KERNEL_ARTIFACT_PATH" "$QEMU_WORKDIR/kernel.bin"
          download_artifact "$QEMU_ROOTFS_ARTIFACT_PATH" "$QEMU_WORKDIR/rootfs.ext4"

          chmod 644 "$QEMU_WORKDIR/kernel.bin" "$QEMU_WORKDIR/rootfs.ext4"
          ls -lh "$QEMU_WORKDIR/kernel.bin" "$QEMU_WORKDIR/rootfs.ext4"

      - name: Boot QEMU
        run: |
          set -euo pipefail

          accel_args="-machine q35,accel=tcg -cpu IvyBridge"
          if [[ -r /dev/kvm ]]; then
            accel_args="-machine q35,accel=kvm -enable-kvm -cpu host"
          fi

          qemu-system-x86_64 \
            $accel_args \
            -kernel "$QEMU_WORKDIR/kernel.bin" \
            -append "console=ttyS0 root=/dev/vda rw rootwait rootdelay=10 rootfstype=ext4 init=/sbin/init" \
            -drive file="$QEMU_WORKDIR/rootfs.ext4",if=virtio,format=raw \
            -smp 4 \
            -m 2048 \
            -display none \
            -serial file:"$QEMU_WORKDIR/serial.log" \
            -netdev user,id=network0,hostfwd=tcp:127.0.0.1:${SSH_HOST_PORT}-:22,hostfwd=tcp:127.0.0.1:${WPEFRAMEWORK_HOST_PORT}-127.0.0.1:9998,hostfwd=tcp:127.0.0.1:${VCOMPONENT_HOST_PORT}-127.0.0.1:8080 \
            -device virtio-net-pci,netdev=network0 \
            -daemonize \
            -pidfile "$QEMU_WORKDIR/qemu.pid"

          for attempt in $(seq 1 240); do
            if nc -z -w2 127.0.0.1 "$SSH_HOST_PORT" 2>/dev/null; then
              break
            fi
            if (( attempt % 30 == 0 )); then
              tail -n 20 "$QEMU_WORKDIR/serial.log" || true
            fi
            sleep 5
          done

          nc -z -w2 127.0.0.1 "$SSH_HOST_PORT"

      - name: Wait for guest SSH login readiness
        id: guest
        run: |
          set -euo pipefail

          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR)
          ssh_key_arg=()

          user_candidates=(root admin)
          for attempt in $(seq 1 240); do
            if [[ -f "$QEMU_WORKDIR/qemu.pid" ]] && ! kill -0 "$(cat "$QEMU_WORKDIR/qemu.pid")" 2>/dev/null; then
              echo "QEMU process exited before SSH became ready" >&2
              break
            fi

            if nc -z -w2 127.0.0.1 "$SSH_HOST_PORT" 2>/dev/null; then
              for ssh_user in "${user_candidates[@]}"; do
                if ssh "${ssh_key_arg[@]}" "${ssh_opts[@]}" -p "$SSH_HOST_PORT" "$ssh_user@127.0.0.1" 'echo SSH_READY' >/dev/null 2>&1; then
                  {
                    echo "QEMU_SSH_PORT=$SSH_HOST_PORT"
                    echo "QEMU_SSH_USER=$ssh_user"
                  } > "$QEMU_WORKDIR/ssh-target.env"
                  echo "SSH ready as user: $ssh_user"
                  exit 0
                fi
              done
            fi

            if (( attempt % 30 == 0 )); then
              echo "SSH login attempt $attempt/240" >&2
              tail -n 30 "$QEMU_WORKDIR/serial.log" 2>/dev/null || true
            fi
            sleep 5
          done

          echo "QEMU guest SSH did not become ready in time" >&2
          echo "----- last 120 lines of serial.log -----" >&2
          tail -n 120 "$QEMU_WORKDIR/serial.log" >&2 || true
          exit 1

      - name: Capture WPEFramework pre-test diagnostics
        if: always() && steps.guest.outcome == 'success'
        run: |
          set -euo pipefail
          source "$QEMU_WORKDIR/ssh-target.env"
          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR)

          ssh "${ssh_opts[@]}" -p "$QEMU_SSH_PORT" "$QEMU_SSH_USER@127.0.0.1" '
            echo "===== uname ====="
            uname -a || true
            echo "===== WPEFramework service status ====="
            systemctl is-active WPEFramework wpeframework 2>/dev/null || true
            systemctl status WPEFramework wpeframework --no-pager 2>/dev/null | head -n 40 || true
            echo "===== listening ports ====="
            ss -ltnp 2>/dev/null | grep -E ":9998|:8080" || netstat -ltnp 2>/dev/null | grep -E ":9998|:8080" || true
            echo "===== recent WPEFramework journal ====="
            journalctl -u WPEFramework -u wpeframework -n 80 --no-pager 2>/dev/null || true
            echo "===== component plugin files ====="
            ls -lh "'"$PLUGIN_GUEST_DIR"'"/'"$PLUGIN_GUEST_GLOB"' 2>/dev/null || echo "MISSING: no component plugins found"
            echo "===== JSON-RPC probe ====="
            curl -sS --connect-timeout 3 --max-time 8 \
              -H "Content-Type: application/json" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.status\"}" \
              http://127.0.0.1:9998/jsonrpc || true
          ' > "$QEMU_WORKDIR/pretest-wpeframework.log" 2>&1 || true
          cat "$QEMU_WORKDIR/pretest-wpeframework.log"

      - name: Validate configured vDevice testcases
        run: |
          set -euo pipefail
          source "$QEMU_WORKDIR/ssh-target.env"
          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR)
          tests_dir="$GITHUB_WORKSPACE/build-framework/$TESTS_DIRECTORY"

          ssh "${ssh_opts[@]}" -p "$QEMU_SSH_PORT" "$QEMU_SSH_USER@127.0.0.1" '
            set -eu
            if [[ -f /etc/device.properties ]]; then
              if grep -q "^RDK_PROFILE=" /etc/device.properties; then
                sed -i "s/^RDK_PROFILE=.*/RDK_PROFILE=STB/" /etc/device.properties
              else
                printf "\nRDK_PROFILE=STB\n" >> /etc/device.properties
              fi
            else
              printf "RDK_PROFILE=STB\n" > /etc/device.properties
            fi
            systemctl restart WPEFramework 2>/dev/null || systemctl restart wpeframework
          '

          echo "Waiting for WPEFramework HTTP service on guest..."
          guest_jsonrpc_ready=false
          for attempt in $(seq 1 60); do
            if ssh "${ssh_opts[@]}" -p "$QEMU_SSH_PORT" "$QEMU_SSH_USER@127.0.0.1" \
              'curl -sf --connect-timeout 3 --max-time 6 http://127.0.0.1:9998/Service >/dev/null 2>&1'; then
              guest_jsonrpc_ready=true
              break
            fi
            sleep 5
          done
          [[ "$guest_jsonrpc_ready" == "true" ]] || {
            echo "ERROR: WPEFramework HTTP service did not become ready." >&2
            exit 1
          }

          JSONRPC_TUNNEL_PORT=59999
          VCOMPONENT_TUNNEL_PORT=58081
          ssh "${ssh_opts[@]}" \
            -o ExitOnForwardFailure=yes -N \
            -L "127.0.0.1:${JSONRPC_TUNNEL_PORT}:127.0.0.1:9998" \
            -L "127.0.0.1:${VCOMPONENT_TUNNEL_PORT}:127.0.0.1:8080" \
            -p "$QEMU_SSH_PORT" "$QEMU_SSH_USER@127.0.0.1" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT

          jsonrpc_ready=false
          for attempt in $(seq 1 30); do
            if curl -sf --connect-timeout 3 --max-time 6 \
              -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","id":1,"method":"Controller.1.status"}' \
              "http://127.0.0.1:${JSONRPC_TUNNEL_PORT}/jsonrpc" >/dev/null 2>&1; then
              jsonrpc_ready=true
              break
            fi
            sleep 3
          done
          [[ "$jsonrpc_ready" == "true" ]] || {
            echo "ERROR: WPEFramework JSON-RPC not responding after 90s." >&2
            exit 1
          }
          nc -z -w3 127.0.0.1 "$VCOMPONENT_TUNNEL_PORT"

          activate_result="$(curl -sS -f --connect-timeout 5 --max-time 10 \
            -H "Content-Type: application/json" \
            --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.activate\",\"params\":{\"callsign\":\"$PLUGIN_CALLSIGN\"}}" \
            "http://127.0.0.1:${JSONRPC_TUNNEL_PORT}/jsonrpc")"
          echo "Activation result (tunnel): $activate_result"
          jq -e 'has("result") and (has("error") | not) and (.result == 0 or .result == null)' \
            <<< "$activate_result" >/dev/null || {
            echo "ERROR: $PLUGIN_CALLSIGN activation failed before tests." >&2
            exit 1
          }

          export TARGET_HOST=127.0.0.1
          export JSONRPC_PORT="$JSONRPC_TUNNEL_PORT"
          export VCOMPONENT_PORT="$VCOMPONENT_TUNNEL_PORT"
          export WPEFRAMEWORK_JSONRPC_URL="http://127.0.0.1:${JSONRPC_TUNNEL_PORT}/jsonrpc"
          for entry in $TEST_ENVIRONMENT; do
            export "$entry"
          done

          cd "$tests_dir"
          python3 "$TEST_ENTRYPOINT" "$COMPONENT_SLUG" 2>&1 | tee "$QEMU_WORKDIR/vdevice-tests.log"

      - name: Collect image coverage data from guest
        id: coverage
        if: always() && steps.guest.outcome == 'success'
        run: |
          set -euo pipefail
          source "$QEMU_WORKDIR/ssh-target.env"
          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR)

          ssh "${ssh_opts[@]}" -p "$QEMU_SSH_PORT" "$QEMU_SSH_USER@127.0.0.1" '
            set -euo pipefail
            curl -sS -f --connect-timeout 5 --max-time 10 \
              -H "Content-Type: application/json" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.deactivate\",\"params\":{\"callsign\":\"'"$PLUGIN_CALLSIGN"'\"}}" \
              http://127.0.0.1:9998/jsonrpc
            systemctl stop WPEFramework 2>/dev/null || systemctl stop wpeframework
            sleep 5
            sync

            find / \( -path /proc -o -path /sys -o -path /dev \) -prune -o \
              -type f \( -name "*.gcno" -o -name "*.gcda" \) -print \
              2>/tmp/coverage-find-errors.log > /tmp/coverage-files.txt || {
              cat /tmp/coverage-find-errors.log >&2
              exit 1
            }
            cat /tmp/coverage-files.txt
            grep -q "\.gcno$" /tmp/coverage-files.txt || {
              echo "ERROR: image contains no .gcno metadata. Coverage requires metadata matching the image build." >&2
              exit 1
            }
            grep -q "\.gcda$" /tmp/coverage-files.txt || {
              echo "ERROR: image produced no .gcda data. A coverage-instrumented plugin is required." >&2
              exit 1
            }
            tar -czf "/tmp/'"$COMPONENT_SLUG"'-coverage.tar.gz" -T /tmp/coverage-files.txt
          ' 2>&1 | tee "$QEMU_WORKDIR/coverage-collection.log"
          scp "${ssh_opts[@]}" -P "$QEMU_SSH_PORT" \
            "$QEMU_SSH_USER@127.0.0.1:/tmp/${COMPONENT_SLUG}-coverage.tar.gz" "$QEMU_WORKDIR/"

      - name: Extract Coverage Data
        id: extract-coverage
        if: always() && steps.coverage.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$QEMU_WORKDIR/coverage"
          tar -xzf "$QEMU_WORKDIR/${COMPONENT_SLUG}-coverage.tar.gz" -C "$QEMU_WORKDIR/coverage"

      - name: Generate Coverage Report
        if: always() && steps.extract-coverage.outcome == 'success'
        run: |
          set -euo pipefail
          lcov --capture --initial \
            --directory "$QEMU_WORKDIR/coverage" \
            --output-file coverage_initial.info
          lcov --capture \
            --directory "$QEMU_WORKDIR/coverage" \
            --output-file coverage_runtime.info
          lcov --add-tracefile coverage_initial.info \
            --add-tracefile coverage_runtime.info \
            --output-file coverage.info
          lcov --extract coverage.info \
            "*/$COMPONENT_DIR/$COVERAGE_SOURCE_DIRECTORY/*.c" \
            "*/$COMPONENT_DIR/$COVERAGE_SOURCE_DIRECTORY/*.cc" \
            "*/$COMPONENT_DIR/$COVERAGE_SOURCE_DIRECTORY/*.cpp" \
            "*/$COMPONENT_DIR/$COVERAGE_SOURCE_DIRECTORY/*.h" \
            "*/$COMPONENT_DIR/$COVERAGE_SOURCE_DIRECTORY/*.hpp" \
            --output-file coverage_plugin.info
          lcov --remove coverage_plugin.info \
            '/usr/*' '*/Tests/*' '*/build/*' \
            --output-file coverage_filtered.info
          # Matching sources are not downloaded; show coverage without source listings.
          genhtml coverage_filtered.info --no-source --output-directory coverage_html
          coverage_summary="$(lcov --summary coverage_filtered.info 2>&1)"
          line_coverage="$(printf '%s\n' "$coverage_summary" | sed -n 's/.*lines\.*: \([0-9.]*\)%.*/\1/p')"
          function_coverage="$(printf '%s\n' "$coverage_summary" | sed -n 's/.*functions\.*: \([0-9.]*\)%.*/\1/p')"
          [[ -n "$line_coverage" && -n "$function_coverage" ]] || {
            echo "ERROR: unable to read line and function coverage from coverage_filtered.info" >&2
            exit 1
          }
          echo "Required coverage: ${MIN_COVERAGE}%"
          echo "Line coverage: ${line_coverage}%"
          echo "Function coverage: ${function_coverage}%"
          awk -v actual="$line_coverage" -v minimum="$MIN_COVERAGE" \
            'BEGIN { exit (actual < minimum) }' || {
              echo "ERROR: line coverage is below the required minimum" >&2
              exit 1
            }
          awk -v actual="$function_coverage" -v minimum="$MIN_COVERAGE" \
            'BEGIN { exit (actual < minimum) }' || {
              echo "ERROR: function coverage is below the required minimum" >&2
              exit 1
            }

      - name: Upload QEMU logs and test coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ env.COMPONENT_SLUG }}-tests-and-coverage-${{ github.run_id }}
          path: |
            /tmp/qemu-artifacts/*.log
            /tmp/qemu-artifacts/*.txt
            /tmp/qemu-artifacts/*.pid
            /tmp/qemu-artifacts/*-coverage.tar.gz
            coverage.info
            coverage_initial.info
            coverage_runtime.info
            coverage_plugin.info
            coverage_filtered.info
            coverage_html/**
          if-no-files-found: warn

      - name: Shutdown QEMU
        if: always()
        run: |
          if [[ -f "$QEMU_WORKDIR/qemu.pid" ]]; then
            kill "$(cat "$QEMU_WORKDIR/qemu.pid")" 2>/dev/null || true
          fi
