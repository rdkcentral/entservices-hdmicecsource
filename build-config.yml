# Component-specific inputs for the generic build framework.
# Copy this file for another component and change only these values.
version: 1

component:
  name: HDMI CEC Source
  # Lowercase identifier used for guest staging dirs, tar names and artifact names.
  slug: hdmicecsource
  source_repo: rdkcentral/entservices-hdmicecsource
  source_directory: entservices-hdmicecsource
  artifactory_qemu_image_url: 'https://artifactory.comcast.com/ui/native/vdevicevendoripks-opkg'
  qemu_kernel_image_name: 'bzImage--5.15.184+git0+9c4fc176ec_9a9d15d3fc-r0-vdevice_x86-64-mw-20260713132320.bin'
  qemu_rootfs_image_name: 'core-image-vdevice-xfce-vdevice_x86-64-mw-20260713132320.rootfs.ext4'
  image_asset_name: DefaultImage.tar.gz
  plugin_callsign: org.rdk.HdmiCecSource

execution:
  dependency_script: build_dependencies_l3.sh
  build_script: cov_build_l3.sh
  tests_branch: qemu
  tests_directory: Tests/vDeviceTests
  test_entrypoint: SuitManager.py
  # Extra environment exported for the test entrypoint (KEY: value).
  test_environment:
    HDMICEC_AUTO_COVERAGE: '0'

copy:
  plugin:
    source_root: install
    source_pattern: '*.so'
    source_filter: /plugins/
    artifact_directory: artifacts/plugins
    guest_directory: /usr/lib/wpeframework/plugins
    stage_directory: plugins
    require_needed_match: true
    # Plugin shared objects deployed to the guest image.
    libraries:
      - libWPEFrameworkHdmiCecSource.so
      - libWPEFrameworkHdmiCecSourceImplementation.so
    # Glob used when listing the component's plugin files already on the guest.
    guest_glob: '*HdmiCec*'
  runtime:
    source_root: install/usr/lib
    source_pattern: '*.so*'
    source_filter: ''
    artifact_directory: artifacts/runtime-libs
    guest_directory: /usr/lib
    stage_directory: runtime
    deploy: true
    # Never deploy these; they exist in the guest image and cause ABI mismatches.
    exclude_patterns:
      - 'libWPEFramework*'
      - 'libds.so*'
      - 'libdshal.so*'
      - 'libdshalcli.so*'
    # Deployment is aborted if any of these end up in the artifact directory.
    forbidden_patterns:
      - 'libds.so*'
      - 'libdshal.so*'
      - 'libdshalcli.so*'
    # Name prefixes listed from the guest image for diagnostics only.
    guest_probe_prefixes:
      - libds
      - libdshalcli
      - libRCEC
      - libRCECHal
      - libRCECOSHal
      - libIARMBus
      - libtelemetry

diagnostics:
  # Extended-regex filter applied to exported symbol listings in diagnostics.
  symbol_filter: 'rdk|plugin|hdmi|cec'

coverage:
  minimum_coverage_threshold: 60
  source_directory: plugin
  source_extensions: 'c|cc|cpp|h|hpp'
